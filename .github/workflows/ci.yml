name: validate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - ".gitignore"
      - "AGENTS.md"
      - "CITATION.cff"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "evals/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "skills/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - ".gitignore"
      - "AGENTS.md"
      - "CITATION.cff"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "evals/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "skills/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
          python-version: "3.13"
          enable-cache: true
      - name: Sync locked maintainer environment
        run: uv sync --locked
      - name: Validate canonical payload and behavioral contract
        run: uv run --locked python scripts/validate.py
      - name: Run validator self-tests
        run: uv run --locked python scripts/validate.py --self-test
      - name: Check cross-agent portability
        run: uv run --locked python .github/scripts/check-portability.py
      - name: Run URL verifier self-tests
        run: uv run --locked python scripts/verify-urls.py --self-test
      - name: Lint maintainer scripts
        run: uv run --locked ruff check scripts .github/scripts

  monitor-external-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify external URL contracts
        run: python3 scripts/verify-urls.py
