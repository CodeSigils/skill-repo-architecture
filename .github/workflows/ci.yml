name: validate

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'SECURITY.md'
      - 'CITATION.cff'
      - 'skills/**/*.md'
      - 'references/**/*.md'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'SECURITY.md'
      - 'CITATION.cff'
      - 'skills/**/*.md'
      - 'references/**/*.md'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Check cross-agent portability
        run: python3 .github/scripts/check-portability.py
      - name: Validate skill source checks
        run: python3 scripts/validate.py
      - name: Verify referenced URLs
        run: python3 scripts/verify-urls.py
      - name: Payload sync check
        run: bash scripts/sync-payload.sh --ci
      - name: Shell script syntax
        run: bash -n scripts/sync-payload.sh
      - name: Ruff check scripts
        run: python3 -m ruff check scripts