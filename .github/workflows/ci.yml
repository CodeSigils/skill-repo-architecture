name: validate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - ".gitignore"
      - "AGENTS.md"
      - "CITATION.cff"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "evals/**"
      - "requirements-dev.txt"
      - "scripts/**"
      - "skills/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - ".gitignore"
      - "AGENTS.md"
      - "CITATION.cff"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "evals/**"
      - "requirements-dev.txt"
      - "scripts/**"
      - "skills/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Validate canonical payload and behavioral contract
        run: python3 scripts/validate.py
      - name: Run validator self-tests
        run: python3 scripts/validate.py --self-test
      - name: Check cross-agent portability
        run: python3 .github/scripts/check-portability.py
      - name: Run URL verifier self-tests
        run: python3 scripts/verify-urls.py --self-test
      - name: Lint maintainer scripts
        run: python3 -m ruff check scripts .github/scripts

  monitor-external-contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify external URL contracts
        run: python3 scripts/verify-urls.py
